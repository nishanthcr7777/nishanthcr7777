name: Generate ASCII Profile Art

on:
  schedule:
    # Runs every Sunday at midnight UTC
    - cron: "0 0 * * 0"
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  generate-ascii:
    name: Regenerate profile art and SVG cards
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r .github/scripts/requirements.txt

      - name: Generate ASCII art PNG
        run: python .github/scripts/generate_ascii.py

      - name: Generate ASCII portrait SVG
        run: |
          if [ -f .github/assets/ascii-art.txt ]; then
            python .github/scripts/generate_portrait_from_txt.py .github/assets/ascii-art.txt .github/assets/portrait.svg
          elif [ -f .github/assets/source.png ] || [ -f .github/assets/source.jpg ] || [ -f .github/assets/source.jpeg ] || [ -f .github/assets/source.webp ]; then
            SRC=$(ls .github/assets/source.png .github/assets/source.jpg .github/assets/source.jpeg .github/assets/source.webp 2>/dev/null | head -n1)
            python .github/scripts/generate_ascii_svg.py "$SRC" .github/assets/portrait.svg
          else
            python .github/scripts/generate_portrait_placeholder.py .github/assets/portrait.svg
          fi

      - name: Generate info / achievements / experience SVGs
        run: |
          python .github/scripts/generate_info_svg.py
          python .github/scripts/generate_achievements_svg.py
          python .github/scripts/generate_experience_svg.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add .github/assets/myself.png .github/assets/portrait.svg .github/assets/info.svg .github/assets/achievements.svg .github/assets/experience.svg
          git diff --staged --quiet || git commit -m "chore: regenerate profile art [skip ci]"
          git push
